
name: Build DeathDimension V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Source
        run: |
          set -e
          mkdir -p source
          unzip -oq DeathDimensionV2.1-DeathEffects-AnimationsOff-Compatible-Source.zip -d source
          test -f source/pom.xml

      - name: Build Plugin
        run: mvn -B -f source/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-V2.1
          path: source/target/*.jar
          if-no-files-found: error
